<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Código Generado</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px;">
    <div style="max-width: 600px; margin: auto; background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        
        <!-- Logo centrado -->
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="https://cpaldaca.com/static_codigos/img/PaldacalogoyRif.png" alt="Paldaca Logo" style="max-width: 150px;">
        </div>

        <!-- Encabezado -->
        <h2 style="color: #32407b; text-align: center;">Nuevo Código Generado</h2>

        <!-- Mensaje introductorio -->
        <p style="text-align: center; font-size: 16px;">
            Se ha generado un nuevo código en el sistema de documentación.
        </p>

        <!-- Detalles del código -->
        <table style="width: 100%; font-size: 16px; margin-top: 20px;">
            <tr>
                <td style="padding: 8px;"><strong>Usuario:</strong></td>
                <td style="padding: 8px;">{{ usuario }}</td>
            </tr>
            <tr style="background-color: #f9f9f9;">
                <td style="padding: 8px;"><strong>Fecha:</strong></td>
                <td style="padding: 8px;">{{ fecha }}</td>
            </tr>
            <tr>
                <td style="padding: 8px;"><strong>Código:</strong></td>
                <td style="padding: 8px; color: #282c89;"><strong>{{ codigo }}</strong></td>
            </tr>
            <tr style="background-color: #f9f9f9;">
                <td style="padding: 8px;"><strong>Motivo:</strong></td>
                <td style="padding: 8px;">{{ motivo }}</td>
            </tr>
        </table>

        <!-- Pie de página -->
        <hr style="margin: 30px 0;">
        <p style="font-size: 12px; color: gray; text-align: center;">
            Este correo fue generado automáticamente por el sistema de generación de códigos de Paldaca.
        </p>
    </div>
</body>
</html>
