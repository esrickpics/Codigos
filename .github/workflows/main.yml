name: Deploy to Namecheap

on:
  push:
    branches: 
      - main

jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:
      # PASO 1: Diagnóstico previo para verificar si el secreto llega vivo
      - name: Validar si el secreto se recibe correctamente
        run: |
          if [ -z "$CLAVE_SECRETA" ]; then
            echo "❌ ERROR: El secreto está vacío."
            exit 1
          else
            echo "✅ GitHub está enviando algo."
            echo "Silueta visual de tu secreto (Letras/Números cambiados por 'x'):"
            echo "----------------------------------------------------"
            echo "$CLAVE_SECRETA" | sed 's/[A-Za-z0-9]/x/g'
            echo "----------------------------------------------------"
          fi
        env:
          CLAVE_SECRETA: ${{ secrets.SSH_PRIVATE_KEY }}
          
      # PASO 2: Despliegue real
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Navegar a la carpeta del proyecto primero
            cd /home/ssapmcco/Projects/Codigos

            # 2. Resolver conflictos de Git de forma segura
            # Stash guarda temporalmente los cambios locales que causan error para que el pull pase limpio
            echo "📦 Guardando cambios locales temporales..."
            git stash

            echo "📥 Trayendo cambios desde GitHub..."
            git pull origin main

            # (Opcional) Si necesitas recuperar tus configuraciones locales después del pull:
            # git stash pop

            # 3. Activar el entorno virtual específico
            echo "🐍 Activando entorno virtual..."
            source /home/ssapmcco/virtualenv/Projects/Codigos/backend/3.13/bin/activate

            # 4. Instalar/actualizar dependencias (corrigiendo la ruta a backend/)
            echo "📦 Instalanado dependencias de Python..."
            pip install -r requirements.txt

            # 5. Ejecutar migraciones si es necesario (Recomendado ya que usas base unificada en MySQL)
            python manage.py migrate --noinput

            # 6. Reiniciar la app en cPanel (Esencial para Python)
            echo "🔄 Reiniciando aplicación Phusion Passenger..."
            touch passenger_wsgi.py